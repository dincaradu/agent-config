# AgentConfig Generated Docker Compose
# Project: test-project
# Generated: 2026-07-31T19:39:52.221033
# 
# Run: docker compose up -d
# 
# Services:
#   - ollama
#   - qdrant
#   - mem0
#   - postgres

version: '3.8'
services:
  ollama:
    image: ollama/ollama:latest
    container_name: test-project_ollama
    ports:
    - 11434:11434
    volumes:
    - ollama_data:/root/.ollama
    networks:
    - agent-config-network
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:11434/api/tags
      interval: 10s
      timeout: 5s
      retries: 5
  qdrant:
    image: qdrant/qdrant:v1.18.1
    container_name: test-project_qdrant
    ports:
    - 6333:6333
    - 6334:6334
    volumes:
    - qdrant_data:/qdrant/storage
    networks:
    - agent-config-network
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:6333/healthz
      interval: 10s
      timeout: 5s
      retries: 5
  mem0:
    image: mem0ai/mem0:latest
    container_name: test-project_mem0
    ports:
    - 8000:8000
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      EMBEDDER_MODEL: nomic-embed-text
      LLM_MODEL: llama3.2:latest
      VECTOR_STORE: qdrant
      QDRANT_URL: http://qdrant:6333
      COLLECTION_NAME: memories
    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
    - agent-config-network
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    container_name: test-project_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent_config
    volumes:
    - postgres_data:/var/lib/postgresql/data
    ports:
    - 5432:5432
    networks:
    - agent-config-network
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres
      interval: 10s
      timeout: 5s
      retries: 5
networks:
  agent-config-network:
    driver: bridge
volumes:
  ollama_data: {}
  qdrant_data: {}
  postgres_data: {}
